name: Update aviation news

on:
  schedule:
    # 05:17 and 15:17 UTC every day (06:17 / 16:17 Madrid in winter)
    - cron: "17 5,15 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and rebuild data/news.json
        run: python scripts/fetch_news.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "datapilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "news: daily update $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
